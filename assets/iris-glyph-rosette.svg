<svg style="color: white;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <mask id="v2g-gleam">
      <rect width="512" height="512" fill="white" />
      <ellipse cx="274" cy="236" rx="16" ry="13" transform="rotate(-25 274 236)" fill="black" />
      <circle cx="290" cy="252" r="6" fill="black" />
    </mask>

    <mask id="v2g-petalMask">
      <rect width="512" height="512" fill="white" />
      <circle cx="256" cy="256" r="74" fill="black" />
