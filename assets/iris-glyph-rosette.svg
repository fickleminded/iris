    <circle cx="256.00" cy="172.00" r="98" />
    <circle cx="328.75" cy="214.00" r="98" />
    <circle cx="328.75" cy="298.00" r="98" />
    <circle cx="256.00" cy="340.00" r="98" />
    <circle cx="183.25" cy="298.00" r="98" />
    <circle cx="183.25" cy="214.00" r="98" />
  </g>

  <!-- Central Pupil (clean transparent negative-space highlight) -->
  <circle cx="256" cy="256" r="66" fill="currentColor" mask="url(#v2g-gleam)" />
</svg>